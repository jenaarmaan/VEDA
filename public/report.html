<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Report to VEDA</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 800px; }
    textarea { width: 100%; height: 150px; padding: 8px; font-size: 14px; }
    button { margin-top: 12px; padding: 8px 14px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Send Report to VEDA</h1>

  <label>Selected text:</label><br/>
  <textarea id="sel"></textarea><br/>

  <div>From page: <span id="pageUrl"></span></div>

  <button id="submitBtn">Submit</button>

  <script type="module">
    // --- 1. Import Firebase SDK ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    // --- 2. Firebase config (replace with YOUR values from Firebase console) ---
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID"
    };

    // --- 3. Initialize Firebase services ---
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // --- 4. Prefill from URL query parameters ---
    const params = new URLSearchParams(window.location.search);
    document.getElementById("sel").value = decodeURIComponent(params.get("selection") || "");
    document.getElementById("pageUrl").textContent = decodeURIComponent(params.get("page") || "");

    // --- 5. Handle submit ---
    document.getElementById("submitBtn").addEventListener("click", async () => {
      // Ask login if not logged in
      if (!auth.currentUser) {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
      }

      const text = document.getElementById("sel").value;
      const page = params.get("page") || "";

      await addDoc(collection(db, "reports"), {
        userId: auth.currentUser.uid,
        text,
        pageUrl: page,
        createdAt: serverTimestamp(),
        status: "pending",
        source: "extension"
      });

      alert("✅ Report saved! Go to your dashboard to view.");
      window.location.href = "/dashboard.html"; // optional redirect
    });
  </script>
</body>
</html>
